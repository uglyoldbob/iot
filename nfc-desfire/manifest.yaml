android:
  aars: [libs/NxpNfcAndroidLib-release-protected]
  java_code_dir: java
  dependencies: [
  ]
  gradle: true
  manifest:
    package: "com.uglyoldbob.rust_iot_nfc"
    uses_permission: [
      name: android.permission.NFC,
      name: android.permission.INTERNET,
      name: android.permission.WRITE_EXTERNAL_STORAGE,
      name: android.permission.ACCESS_NETWORK_STATE,
      name: android.permission.READ_DEVICE_CONFIG,
    ]
    uses_feature: [
        { name: android.hardware.nfc, required: true }
    ]
    xmlns_tools: 'http://schemas.android.com/tools'
    application:
      tools_replace: 'android:label'
      theme: '@android:style/Theme.NoTitleBar.Fullscreen'
      label: "Rust Iot NFC"
      has_code: true
      activities: [
        { 
          name: .ModdedActivity,
          config_changes: 'orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode',
          launch_mode: singleTop,
          window_soft_input_mode: adjustResize,
          hardware_accelerated: true,
        },
      ]